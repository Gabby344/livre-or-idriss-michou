<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Le livre — Idriss & Michou</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/print.css">
</head>
<body class="print-body">

<div class="toolbar no-print" id="toolbar" hidden>
  <div class="wrap">
    <div><strong id="stat">Chargement…</strong><br><span class="hint">Format A5 · une page par message · dans la fenêtre d'impression, choisissez « Enregistrer au format PDF » et désactivez les en-têtes/pieds de page.</span></div>
    <div class="row-actions">
      <a class="btn btn-ghost btn-sm" href="admin.html">← Modération</a>
      <button class="btn btn-ghost btn-sm" id="shuffle">Changer les photos</button>
      <button class="btn btn-wine btn-sm" id="print">Imprimer le livre</button>
    </div>
  </div>
</div>

<div class="gate no-print" id="gate" hidden>
  <h1>Accès réservé</h1>
  <p>L'impression du livre est réservée à l'administrateur.</p>
  <a class="btn btn-wine" href="admin.html">Se connecter</a>
</div>

<main id="book"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module" src="js/print.js"></script>
</body>
</html>
